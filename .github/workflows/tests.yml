name: Check legal workstation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tools and isolated profile setup
        run: python -m unittest discover -s tests -v -p 'test_*.py'
      - name: Validate the current sample agreements
        env:
          LEGAL_DATA_DIR: fixtures/weekly-review-v3
        run: python scripts/build_seed.py
